<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Email - AUTOTRADEAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #f8fafc;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #f8fafc;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 14px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .result.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .env-info {
            margin-top: 20px;
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Teste de Email</h1>
        <p>Teste o serviço de envio de email localmente</p>

        <div class="form-group">
            <label for="email">Email de Destino:</label>
            <input type="email" id="email" placeholder="seu-email@teste.com" value="test@example.com">
        </div>

        <div class="form-group">
            <label for="subject">Assunto:</label>
            <input type="text" id="subject" placeholder="Assunto do email" value="Teste de Email - AUTOTRADEAI">
        </div>

        <div class="form-group">
            <label for="message">Mensagem:</label>
            <textarea id="message" placeholder="Mensagem do email">Prezado Cliente, a sua operação foi aprovada com sucesso e encontra-se actualmente em fase de conclusão. Para efeitos de conformidade, a operação poderá estar sujeita à verificação e aos procedimentos de Anti-Money Laundering (AML) aplicáveis, incluindo eventuais encargos oficialmente previstos nos termos da operação.

Para obter informações sobre os procedimentos, confirmar qualquer eventual taxa e saber como proceder, agende uma reunião através do WhatsApp: +27 (63) 149-6245 ou +61 489 996 203.

AUTOTRADE, AI</textarea>
        </div>

        <div class="form-group">
            <label for="code">Código (opcional):</label>
            <input type="text" id="code" placeholder="Código de verificação" value="123456">
        </div>

        <button onclick="sendEmail()" id="sendBtn">Enviar Email</button>

        <div class="result" id="result"></div>

        <div class="env-info">
            <strong>Informações do Ambiente:</strong><br>
            Servidor PHP: http://localhost:8002<br>
            Script: /send-email.php<br>
            Status: Rodando ✓
        </div>
    </div>

    <script>
        async function sendEmail() {
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const code = document.getElementById('code').value;
            const sendBtn = document.getElementById('sendBtn');
            const resultDiv = document.getElementById('result');

            if (!email || !subject || !message) {
                showResult('error', 'Por favor, preencha todos os campos obrigatórios');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Enviando...';

            try {
                const response = await fetch('http://localhost:8002/send-email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        subject: subject,
                        message: message,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult('success', '✅ Email enviado com sucesso!<br>Código: ' + (data.code || 'N/A'));
                } else {
                    showResult('error', '❌ Erro ao enviar email: ' + data.error);
                }
            } catch (error) {
                showResult('error', '❌ Erro na requisição: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Enviar Email';
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result ' + type;
            resultDiv.innerHTML = message;
        }
    </script>
</body>
</html>
